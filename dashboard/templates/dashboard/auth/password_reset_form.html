
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Forex Terminal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1117;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .reset-card {
            width: 420px;
            max-width: 92%;
            background: #151821;
            border: 1px solid #292d36;
            border-radius: 10px;
            padding: 30px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #8c919c;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #b8bdc8;
            font-size: 13px;
            margin-bottom: 8px;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #333842;
            border-radius: 6px;
            background: #1c2029;
            color: white;
        }

        input:focus {
            outline: none;
            border-color: #2962ff;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2962ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1e53d8;
        }

        .errorlist {
            color: #ef5350;
            font-size: 12px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2962ff;
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="reset-card">

    <h1>Reset Password</h1>

    <div class="subtitle">
        Enter your registered email address.
        If an eligible account exists, we'll send
        instructions to reset your password.
    </div>

    <form method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}

        <label for="{{ form.email.id_for_label }}">
            Email address
        </label>

        {{ form.email }}

        {{ form.email.errors }}

        <button type="submit">
            Send Reset Link
        </button>
    </form>

    <a href="{% url 'login' %}" class="back-link">
        Back to Login
    </a>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Forex Terminal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1117;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-card {
            width: 380px;
            max-width: 92%;
            background: #151821;
            border: 1px solid #292d36;
            border-radius: 10px;
            padding: 30px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .subtitle {
            color: #8c919c;
            font-size: 13px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #b8bdc8;
            font-size: 12px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-bottom: 15px;
            border: 1px solid #333842;
            border-radius: 6px;
            background: #1c2029;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #2962ff;
        }

        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 6px;
            background: #2962ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1e53d8;
        }

        .errorlist {
            color: #ef5350;
            font-size: 12px;
            padding-left: 18px;
        }

        .register {
            margin-top: 20px;
            text-align: center;
            color: #8c919c;
            font-size: 12px;
        }

        .register a {
            color: #2962ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-card">

    <h1>Forex Terminal</h1>

    <div class="subtitle">
        Sign in to access your trading dashboard
    </div>

    <form method="post">

        {% csrf_token %}

        {{ form.non_field_errors }}

        <label for="{{ form.username.id_for_label }}">
            Username
        </label>

        {{ form.username }}

        {{ form.username.errors }}

        <label for="{{ form.password.id_for_label }}">
            Password
        </label>

        {{ form.password }}

        {{ form.password.errors }}

        <button type="submit">
            Sign In
        </button>

    </form>

    <div class="register">
        Don't have an account?
        <a href="{% url 'register' %}">
            Create account
        </a>
    </div>

</div>

</body>
</html>

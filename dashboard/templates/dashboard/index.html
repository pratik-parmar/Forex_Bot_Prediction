<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forex Trading Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f1117;
            color: #ffffff;
            transition: 0.3s;
        }

        body.light {
            background: #f4f5f7;
            color: #111111;
        }

        /* Layout */
        .app {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 230px;
            background: #151821;
            border-right: 1px solid #292d36;
            padding: 25px 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 35px;
            padding-left: 10px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu button {
            background: transparent;
            border: none;
            color: #aaa;
            padding: 13px;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .menu button:hover,
        .menu button.active {
            background: #242832;
            color: white;
        }

        /* Main */
        .main {
            flex: 1;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .connection {
            font-size: 13px;
            color: #26a69a;
        }

        .theme-btn {
            border: 1px solid #333842;
            background: #151821;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: #151821;
            border: 1px solid #292d36;
            border-radius: 8px;
            padding: 18px;
        }

        .card-title {
            color: #8c919c;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 22px;
            font-weight: bold;
        }

        /* Chart */
        .chart-card {
            background: #151821;
            border: 1px solid #292d36;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .symbol {
            font-size: 20px;
            font-weight: bold;
        }

        .timeframes {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .timeframe-btn {
            border: 1px solid #333842;
            background: #1b1e26;
            color: #aaa;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .timeframe-btn:hover {
            background: #292d36;
            color: white;
        }

        .timeframe-btn.active {
            background: #ffffff;
            color: #111111;
        }

        /* Bottom panels */
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: #151821;
            border: 1px solid #292d36;
            border-radius: 8px;
            padding: 20px;
        }

        .panel h3 {
            margin-bottom: 18px;
        }

        .indicator {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #292d36;
        }

        .indicator:last-child {
            border-bottom: none;
        }

        .indicator-label {
            color: #8c919c;
        }

        /* Signal */
        .signal-box {
            padding: 15px;
            border-radius: 7px;
            background: #1c2029;
            margin-bottom: 15px;
            text-align: center;
        }

        #signal {
            font-size: 24px;
            font-weight: bold;
        }

        /* Trade */
        .trade-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #292d36;
        }

        .trade-row span:first-child {
            color: #8c919c;
        }

        .trade-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .buy-btn,
        .sell-btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .buy-btn {
            background: #26a69a;
        }

        .sell-btn {
            background: #ef5350;
        }

        .buy-btn:hover,
        .sell-btn:hover {
            opacity: 0.85;
        }

        /* Light mode overrides */
        body.light .sidebar,
        body.light .card,
        body.light .chart-card,
        body.light .panel {
            background: white;
            border-color: #ddd;
        }

        body.light .theme-btn {
            background: white;
            color: #111;
            border-color: #ddd;
        }

        body.light .timeframe-btn {
            background: #f5f5f5;
            color: #555;
            border-color: #ddd;
        }

        body.light .timeframe-btn.active {
            background: #111;
            color: white;
        }

        body.light .signal-box {
            background: #f3f3f3;
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .sidebar {
                width: 180px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 700px) {
            .app {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #292d36;
            }

            .menu {
                flex-direction: row;
                overflow-x: auto;
            }

            .main {
                padding: 12px;
            }

            .stats,
            .bottom-grid {
                grid-template-columns: 1fr;
            }

            .chart-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">Forex Terminal</div>
        <div class="menu">
            <button class="active">Dashboard</button>
            <button>Markets</button>
            <button>Signals</button>
            <button>Trades</button>
            <button>Settings</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main">

        <!-- Header -->
        <div class="header">
            <h1>Trading Dashboard</h1>
            <div class="header-right">
                <span class="connection" id="market-status">Connecting...</span>
                <button class="theme-btn" onclick="toggleTheme()">Toggle Theme</button>
            </div>
        </div>

        <!-- Statistics Cards -->
        <div class="stats">
            <div class="card">
                <div class="card-title">ACCOUNT BALANCE</div>
                <div class="card-value" id="balance">$150.00</div>
            </div>

            <div class="card">
                <div class="card-title">XAUUSD PRICE</div>
                <div class="card-value" id="price">$--.--</div>
            </div>

            <div class="card">
                <div class="card-title">TIMEFRAME</div>
                <div class="card-value" id="current-timeframe">15m</div>
            </div>

            <div class="card">
                <div class="card-title">MAX RISK</div>
                <div class="card-value">$1.50</div>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="chart-card">
            <div class="chart-header">
                <div>
                    <div class="symbol">XAUUSD</div>
                    <small>Gold / US Dollar</small>
                </div>

                <!-- Synchronized Timeframe Controls -->
                <div class="timeframes">
                    <button class="timeframe-btn" data-tv="1" data-display="1m">1m</button>
                    <button class="timeframe-btn" data-tv="5" data-display="5m">5m</button>
                    <button class="timeframe-btn active" data-tv="15" data-display="15m">15m</button>
                    <button class="timeframe-btn" data-tv="30" data-display="30m">30m</button>
                    <button class="timeframe-btn" data-tv="60" data-display="1H">1H</button>
                    <button class="timeframe-btn" data-tv="D" data-display="1D">1D</button>
                </div>
            </div>

            <!-- Embedded TradingView Chart Widget -->
            <div class="tradingview-widget-container" style="height: 500px; width: 100%;">
                <div id="tradingview_xauusd" style="height: 100%; width: 100%;"></div>
            </div>
        </div>

        <!-- Bottom Panels -->
        <div class="bottom-grid">

            <!-- Technical Indicators -->
            <div class="panel">
                <h3>Technical Indicators</h3>

                <div class="indicator">
                    <span class="indicator-label">EMA 20</span>
                    <span id="ema20">--</span>
                </div>

                <div class="indicator">
                    <span class="indicator-label">EMA 50</span>
                    <span id="ema50">--</span>
                </div>

                <div class="indicator">
                    <span class="indicator-label">RSI 14</span>
                    <span id="rsi">--</span>
                </div>

                <div class="indicator">
                    <span class="indicator-label">ATR 14</span>
                    <span id="atr">--</span>
                </div>
            </div>

            <!-- Trading Signals -->
            <div class="panel">
                <h3>Trading Signal</h3>

                <div class="signal-box">
                    <div id="signal">HOLD</div>
                </div>

                <div class="trade-row">
                    <span>Entry</span>
                    <span id="entry">--</span>
                </div>

                <div class="trade-row">
                    <span>Stop Loss</span>
                    <span id="stop-loss">--</span>
                </div>

                <div class="trade-row">
                    <span>Take Profit</span>
                    <span id="take-profit">--</span>
                </div>

                <div class="trade-buttons">
                    <button class="buy-btn" onclick="buyTrade()">BUY</button>
                    <button class="sell-btn" onclick="sellTrade()">SELL</button>
                </div>
            </div>

        </div>

    </main>

</div>

<!-- TradingView Script -->
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

<script>
/*
====================================================
GLOBAL VARIABLES & STATE
====================================================
*/
let currentInterval = "15";
let globalCandles = [];

/*
====================================================
TRADINGVIEW WIDGET INITIALIZATION
====================================================
*/
function renderTradingViewWidget(interval) {
    new TradingView.widget({
        "autosize": true,
        "symbol": "OANDA:XAUUSD",
        "interval": interval,
        "timezone": "Etc/UTC",
        "theme": document.body.classList.contains("light") ? "light" : "dark",
        "style": "1",
        "locale": "en",
        "enable_publishing": false,
        "allow_symbol_change": true,
        "container_id": "tradingview_xauusd"
    });
}

/*
====================================================
TIMEFRAME SWITCHING & SYNC
====================================================
*/
document.querySelectorAll(".timeframe-btn").forEach(button => {
    button.addEventListener("click", function () {
        document.querySelectorAll(".timeframe-btn").forEach(btn => btn.classList.remove("active"));
        this.classList.add("active");

        const tvInterval = this.dataset.tv;
        const displayLabel = this.dataset.display;

        // 1. Update top card
        document.getElementById("current-timeframe").innerText = displayLabel;
        currentInterval = tvInterval;

        // 2. Re-render chart with selected timeframe
        renderTradingViewWidget(tvInterval);

        // 3. Update indicators based on latest candles
        fetchLivePriceAndData();
    });
});

/*
====================================================
INDICATOR & SIGNAL CALCULATIONS
====================================================
*/
function calculateEMA(prices, period) {
    if (prices.length < period) return null;
    const k = 2 / (period + 1);
    let ema = prices.slice(0, period).reduce((acc, val) => acc + val, 0) / period;
    for (let i = period; i < prices.length; i++) {
        ema = (prices[i] * k) + (ema * (1 - k));
    }
    return ema;
}

function calculateRSI(prices, period = 14) {
    if (prices.length <= period) return null;
    let gains = 0;
    let losses = 0;
    for (let i = 1; i <= period; i++) {
        const diff = prices[i] - prices[i - 1];
        if (diff >= 0) gains += diff;
        else losses -= diff;
    }
    let avgGain = gains / period;
    let avgLoss = losses / period;

    for (let i = period + 1; i < prices.length; i++) {
        const diff = prices[i] - prices[i - 1];
        if (diff >= 0) {
            avgGain = (avgGain * (period - 1) + diff) / period;
            avgLoss = (avgLoss * (period - 1)) / period;
        } else {
            avgGain = (avgGain * (period - 1)) / period;
            avgLoss = (avgLoss * (period - 1) - diff) / period;
        }
    }
    if (avgLoss === 0) return 100;
    const rs = avgGain / avgLoss;
    return 100 - (100 / (1 + rs));
}

function calculateATR(candles, period = 14) {
    if (candles.length <= period) return null;
    let trs = [];
    for (let i = 1; i < candles.length; i++) {
        const high = candles[i].high;
        const low = candles[i].low;
        const prevClose = candles[i - 1].close;
        const tr = Math.max(
            high - low,
            Math.abs(high - prevClose),
            Math.abs(low - prevClose)
        );
        trs.push(tr);
    }
    let atr = trs.slice(0, period).reduce((acc, val) => acc + val, 0) / period;
    for (let i = period; i < trs.length; i++) {
        atr = (atr * (period - 1) + trs[i]) / period;
    }
    return atr;
}

function updateIndicatorsAndSignals(candles) {
    if (!candles || candles.length < 50) return;

    const closePrices = candles.map(c => c.close);
    const ema20 = calculateEMA(closePrices, 20);
    const ema50 = calculateEMA(closePrices, 50);
    const rsi = calculateRSI(closePrices, 14);
    const atr = calculateATR(candles, 14);

    if (ema20 !== null) document.getElementById("ema20").innerText = `$${ema20.toFixed(2)}`;
    if (ema50 !== null) document.getElementById("ema50").innerText = `$${ema50.toFixed(2)}`;
    if (rsi !== null) document.getElementById("rsi").innerText = rsi.toFixed(2);
    if (atr !== null) document.getElementById("atr").innerText = `$${atr.toFixed(2)}`;

    const currentPrice = closePrices[closePrices.length - 1];
    const signalElem = document.getElementById("signal");
    const entryElem = document.getElementById("entry");
    const slElem = document.getElementById("stop-loss");
    const tpElem = document.getElementById("take-profit");

    const atrValue = atr || 2.5;

    if (ema20 > ema50 && rsi > 50 && rsi < 70) {
        signalElem.innerText = "BUY";
        signalElem.style.color = "#26a69a";
        entryElem.innerText = `$${currentPrice.toFixed(2)}`;
        slElem.innerText = `$${(currentPrice - (atrValue * 1.5)).toFixed(2)}`;
        tpElem.innerText = `$${(currentPrice + (atrValue * 3.0)).toFixed(2)}`;
    } else if (ema20 < ema50 && rsi < 50 && rsi > 30) {
        signalElem.innerText = "SELL";
        signalElem.style.color = "#ef5350";
        entryElem.innerText = `$${currentPrice.toFixed(2)}`;
        slElem.innerText = `$${(currentPrice + (atrValue * 1.5)).toFixed(2)}`;
        tpElem.innerText = `$${(currentPrice - (atrValue * 3.0)).toFixed(2)}`;
    } else {
        signalElem.innerText = "HOLD";
        signalElem.style.color = "#8c919c";
        entryElem.innerText = "--";
        slElem.innerText = "--";
        tpElem.innerText = "--";
    }
}

/*
====================================================
FETCH DATA AND UPDATE PRICE CARD (EVERY 1 MIN)
====================================================
*/
async function fetchLivePriceAndData() {
    try {
        const response = await fetch(`/api/market-candles/?timeframe=${currentInterval}m`);
        if (!response.ok) throw new Error("HTTP connection failed");

        const result = await response.json();
        if (result.candles && result.candles.length > 0) {
            globalCandles = result.candles;
            const latestPrice = globalCandles[globalCandles.length - 1].close;

            // Update top card
            document.getElementById("price").innerText = `$${latestPrice.toFixed(2)}`;
            document.getElementById("market-status").innerText = "Connected";

            // Update technical indicators
            updateIndicatorsAndSignals(globalCandles);
        }
    } catch (error) {
        console.error("Data Fetch Error:", error);
        document.getElementById("market-status").innerText = "Disconnected";
    }
}

/*
====================================================
UI HELPERS & BUTTON ACTIONS
====================================================
*/
function toggleTheme() {
    document.body.classList.toggle("light");
    renderTradingViewWidget(currentInterval);
}

function buyTrade() {
    alert("BUY order placed! (Connecting to MT5)");
}

function sellTrade() {
    alert("SELL order placed! (Connecting to MT5)");
}

/*
====================================================
INITIALIZATION
====================================================
*/
document.addEventListener("DOMContentLoaded", function () {
    // Render initial chart
    renderTradingViewWidget("15");

    // Load market prices and start polling
    fetchLivePriceAndData();
    
    // Poll every 1 minute (60,000 ms)
    setInterval(fetchLivePriceAndData, 60000);
});
</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Forex Terminal</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center;
            justify-content: center; background: #0f1117; color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }
        .card {
            width: 420px; max-width: 92%; background: #151821;
            border: 1px solid #292d36; border-radius: 10px; padding: 30px;
        }
        h1 { margin: 0 0 8px; font-size: 24px; }
        .subtitle { color: #8c919c; font-size: 13px; margin-bottom: 22px; line-height: 1.5; }
        label { display: block; color: #b8bdc8; font-size: 12px; margin-bottom: 6px; }
        input {
            width: 100%; padding: 12px; margin-bottom: 14px; border: 1px solid #333842;
            border-radius: 6px; background: #1c2029; color: #fff; letter-spacing: 5px;
            font-size: 20px; text-align: center;
        }
        button {
            width: 100%; padding: 11px; border: 0; border-radius: 6px;
            background: #2962ff; color: #fff; font-weight: bold; cursor: pointer;
        }
        .secondary { margin-top: 10px; background: transparent; border: 1px solid #333842; }
        .messages { padding: 0; list-style: none; font-size: 12px; }
        .messages li { margin: 8px 0; color: #ffb74d; }
        .footer { margin-top: 18px; font-size: 12px; color: #8c919c; text-align: center; }
        a { color: #7196ff; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <h1>Verify your email</h1>
    <div class="subtitle">
        Enter the 6-digit code sent to <strong>{{ email }}</strong>.
        The code expires in 10 minutes.
    </div>

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label for="otp">Verification code</label>
        <input
            id="otp"
            name="otp"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="[0-9]{6}"
            minlength="6"
            maxlength="6"
            placeholder="000000"
            required
        >
        <button type="submit">Verify email</button>
    </form>

    <form method="post">
        {% csrf_token %}
        <button class="secondary" type="submit" name="resend" value="1">
            Resend verification code
        </button>
    </form>

    <div class="footer">
        Wrong email? <a href="{% url 'register' %}">Register again</a>
        · <a href="{% url 'login' %}">Sign in</a>
    </div>
</div>
</body>
</html>
